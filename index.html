<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Space ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background: #efeae2;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }
        @media (min-width: 481px) {
            .app-container {
                height: 85vh;
                border-radius: 16px;
                overflow: hidden;
            }
        }
        /* Header */
        header {
            background-color: #075e54;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            z-index: 10;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }
        .header-info h2 {
            font-size: 16px;
            font-weight: 600;
        }
        .header-info p {
            font-size: 12px;
            color: #e2e8f0;
        }
        /* Chat Area */
        #chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
        }
        .message.sent {
            background-color: #dcf8c6;
            color: #111;
            align-self: flex-end;
            border-top-right-radius: 0;
        }
        .message.received {
            background-color: #ffffff;
            color: #111;
            align-self: flex-start;
            border-top-left-radius: 0;
        }
        .sender {
            font-size: 11px;
            font-weight: bold;
            color: #075e54;
            display: block;
            margin-bottom: 2px;
        }
        .time {
            font-size: 9px;
            color: #666;
            float: right;
            margin-left: 8px;
            margin-top: 4px;
        }
        /* Input Bar */
        #form {
            background: #f0f0f0;
            padding: 10px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
        }
        #nameInput {
            width: 90px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 13px;
            background: white;
            text-align: center;
        }
        #input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background: white;
        }
        #form button {
            background-color: #075e54;
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
            transition: background 0.2s;
        }
        #form button:active {
            background-color: #0b8072;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="avatar">❤️</div>
            <div class="header-info">
                <h2>Our Private Chat</h2>
                <p>Online</p>
            </div>
        </header>

        <div id="chat-box"></div>

        <form id="form" action="">
            <input id="nameInput" type="text" placeholder="Naam" required autocomplete="off" />
            <input id="input" type="text" placeholder="Message likhein..." required autocomplete="off" />
            <button type="submit">➤</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const nameInput = document.getElementById('nameInput');
        const chatBox = document.getElementById('chat-box');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value.trim() && nameInput.value.trim()) {
                const messageData = {
                    name: nameInput.value.trim(),
                    text: input.value.trim(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                socket.emit('chat message', messageData);
                input.value = '';
            }
        });

        socket.on('chat message', function(data) {
            const item = document.createElement('div');
            item.classList.add('message');
            
            const isSent = nameInput.value && data.name.toLowerCase() === nameInput.value.trim().toLowerCase();
            item.classList.add(isSent ? 'sent' : 'received');

            item.innerHTML = `
                <span class="sender">${data.name}</span>
                <span>${data.text}</span>
                <span class="time">${data.time || ''}</span>
            `;
            chatBox.appendChild(item);
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        // Mobile Back Button Experience Support
        window.history.pushState({page: 1}, "", "");
        window.addEventListener('popstate', function(event) {
            // Jab user mobile ka back button dabaye, toh confirmation ya clean exit mile
            let leave = confirm("Kya aap chat band karna chahte hain?");
            if (leave) {
                window.history.back();
            } else {
                window.history.pushState({page: 1}, "", "");
            }
        });
    </script>
</body>
</html>
