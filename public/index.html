<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Calculator & Notes</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100vh;
            background: #efeae2;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }
        @media (min-width: 481px) {
            .app-container {
                height: 85vh;
                max-height: 700px;
                border-radius: 16px;
            }
        }

        /* --- FAKE CALCULATOR SCREEN (FIXED SIZE) --- */
        #calculator-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #171717;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
        }
        .calc-display {
            color: #ffffff;
            font-size: 36px;
            text-align: right;
            padding: 15px 10px;
            word-break: break-all;
            background: #262626;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding-bottom: 10px;
        }
        .calc-btn {
            background: #333333;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 70px;
            margin: 0 auto;
        }
        .calc-btn:active { background: #525252; }
        .calc-btn.operator { background: #ff9f0a; }
        .calc-btn.equal { background: #34c759; }

        /* --- CHAT APP UI --- */
        #chat-app {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: #efeae2;
            z-index: 10;
        }
        .hidden { display: none !important; }

        header {
            background-color: #075e54;
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            z-index: 10;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        .header-info h2 {
            font-size: 16px;
            font-weight: 600;
        }
        .header-info p {
            font-size: 12px;
            color: #e2e8f0;
        }
        .lock-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
        }

        /* Chat Area */
        #chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .message {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13);
        }
        .message.sent {
            background-color: #dcf8c6;
            color: #111;
            align-self: flex-end;
            border-top-right-radius: 0;
        }
        .message.received {
            background-color: #ffffff;
            color: #111;
            align-self: flex-start;
            border-top-left-radius: 0;
        }
        .sender {
            font-size: 11px;
            font-weight: bold;
            color: #075e54;
            display: block;
            margin-bottom: 2px;
        }
        .time {
            font-size: 9px;
            color: #666;
            float: right;
            margin-left: 8px;
            margin-top: 4px;
        }

        /* Input Bar */
        #form {
            background: #f0f0f0;
            padding: 10px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
        }
        #nameInput {
            width: 80px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 13px;
            background: white;
            text-align: center;
        }
        #input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
            background: white;
        }
        #form button {
            background-color: #075e54;
            color: white;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- FAKE CALCULATOR (SECRET COVER) -->
        <div id="calculator-screen">
            <div class="calc-display" id="calc-display">0</div>
            <div class="calc-buttons">
                <button class="calc-btn" onclick="calcClear()">C</button>
                <button class="calc-btn" onclick="calcPress('(')">(</button>
                <button class="calc-btn" onclick="calcPress(')')">)</button>
                <button class="calc-btn operator" onclick="calcPress('/')">÷</button>
                
                <button class="calc-btn" onclick="calcPress('7')">7</button>
                <button class="calc-btn" onclick="calcPress('8')">8</button>
                <button class="calc-btn" onclick="calcPress('9')">9</button>
                <button class="calc-btn operator" onclick="calcPress('*')">×</button>
                
                <button class="calc-btn" onclick="calcPress('4')">4</button>
                <button class="calc-btn" onclick="calcPress('5')">5</button>
                <button class="calc-btn" onclick="calcPress('6')">6</button>
                <button class="calc-btn operator" onclick="calcPress('-')">-</button>
                
                <button class="calc-btn" onclick="calcPress('1')">1</button>
                <button class="calc-btn" onclick="calcPress('2')">2</button>
                <button class="calc-btn" onclick="calcPress('3')">3</button>
                <button class="calc-btn operator" onclick="calcPress('+')">+</button>
                
                <button class="calc-btn" onclick="calcPress('0')" style="grid-column: span 2; max-width: 100%; border-radius: 35px;">0</button>
                <button class="calc-btn" onclick="calcPress('.')">.</button>
                <button class="calc-btn equal" onclick="calcCalculate()">=</button>
            </div>
        </div>

        <!-- REAL CHAT APPLICATION -->
        <div id="chat-app" class="hidden">
            <header>
                <div class="header-left">
                    <div class="avatar">🔒</div>
                    <div class="header-info">
                        <h2>Secure Space</h2>
                        <p>End-to-End Private</p>
                    </div>
                </div>
                <button class="lock-btn" onclick="lockApp()">Lock 🔒</button>
            </header>

            <div id="chat-box"></div>

            <form id="form" action="">
                <input id="nameInput" type="text" placeholder="Naam" required autocomplete="off" />
                <input id="input" type="text" placeholder="Message likhein..." required autocomplete="off" />
                <button type="submit">➤</button>
            </form>
        </div>

    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const SECRET_PIN = "1432"; // Apna secret PIN yahan change kar sakte hain
        let calcInput = "";

        function calcPress(val) {
            if(calcInput === "0") calcInput = "";
            calcInput += val;
            document.getElementById('calc-display').innerText = calcInput;
        }

        function calcClear() {
            calcInput = "";
            document.getElementById('calc-display').innerText = "0";
        }

        function calcCalculate() {
            try {
                if(calcInput.trim() === SECRET_PIN) {
                    openChatApp();
                    calcClear();
                    return;
                }
                let result = eval(calcInput);
                document.getElementById('calc-display').innerText = result;
                calcInput = result.toString();
            } catch (e) {
                document.getElementById('calc-display').innerText = "Error";
                calcInput = "";
            }
        }

        function openChatApp() {
            document.getElementById('calculator-screen').classList.add('hidden');
            document.getElementById('chat-app').classList.remove('hidden');
        }

        function lockApp() {
            document.getElementById('chat-app').classList.add('hidden');
            document.getElementById('calculator-screen').classList.remove('hidden');
            calcClear();
        }

        // --- PANIC FEATURES: DOUBLE TAP & SHAKE TO LOCK ---
        
        // 1. Double Tap Anywhere to Lock (Jab chat khuli ho)
        let lastTap = 0;
        document.addEventListener('touchend', function(e) {
            let chatApp = document.getElementById('chat-app');
            if (!chatApp.classList.contains('hidden')) {
                let currentTime = new Date().getTime();
                let tapLength = currentTime - lastTap;
                if (tapLength < 300 && tapLength > 0) {
                    lockApp(); // Turant calculator screen par switch ho jayega
                    e.preventDefault();
                }
                lastTap = currentTime;
            }
        });

        // 2. Shake Phone to Lock (Mobile sensors ke zariye)
        let lastX = 0, lastY = 0, lastZ = 0;
        let lastUpdate = 0;
        
        window.addEventListener('devicemotion', function(e) {
            let chatApp = document.getElementById('chat-app');
            if (!chatApp.classList.contains('hidden')) {
                let current = e.accelerationIncludingGravity;
                if (current) {
                    let currentTime = new Date().getTime();
                    if ((currentTime - lastUpdate) > 100) {
                        let diffTime = currentTime - lastUpdate;
                        lastUpdate = currentTime;
                        
                        let x = current.x;
                        let y = current.y;
                        let z = current.z;
                        
                        let speed = Math.abs(x + y + z - lastX - lastY - lastZ) / diffTime * 10000;
                        
                        // Agar phone ko tezi se hilaaya gaya toh lock ho jayega
                        if (speed > 25) { 
                            lockApp();
                        }
                        lastX = x;
                        lastY = y;
                        lastZ = z;
                    }
                }
            }
        });

        // --- CHAT LOGIC ---
        const socket = io();
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const nameInput = document.getElementById('nameInput');
        const chatBox = document.getElementById('chat-box');

        if(localStorage.getItem('chat_user_name')) {
            nameInput.value = localStorage.getItem('chat_user_name');
        }

        nameInput.addEventListener('input', function() {
            localStorage.setItem('chat_user_name', nameInput.value.trim());
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            if (input.value.trim() && nameInput.value.trim()) {
                const messageData = {
                    name: nameInput.value.trim(),
                    text: input.value.trim(),
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };
                socket.emit('chat message', messageData);
                input.value = '';
            }
        });

        socket.on('chat message', function(data) {
            const item = document.createElement('div');
            item.classList.add('message');
            
            const isSent = nameInput.value && data.name.toLowerCase() === nameInput.value.trim().toLowerCase();
            item.classList.add(isSent ? 'sent' : 'received');

            item.innerHTML = `
                <span class="sender">${data.name}</span>
                <span>${data.text}</span>
                <span class="time">${data.time || ''}</span>
            `;
            chatBox.appendChild(item);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
